# Approved source history imported; verify the published organization website.
name: Verify deployed ONE PLACE
# Run on every production update; old path filtering skipped valid releases.
# Do not run this deployment-dependent check for pull requests.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer main revision supersedes smoke results from an older deploy.
concurrency:
  group: verify-live-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  deployed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify successful Pages deployment for the exact commit
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, time, urllib.error, urllib.request
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Cache-Control': 'no-cache'
          }
          for attempt in range(60):
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      runs = json.load(response)['workflow_runs']
                  pages = [r for r in runs if
                           r.get('name') == 'pages build and deployment' and
                           r.get('head_sha') == sha and
                           r.get('head_branch') == 'main']
                  if pages:
                      latest = max(pages, key=lambda r: r['created_at'])
                      if latest['status'] == 'completed':
                          if latest.get('conclusion') != 'success':
                              raise RuntimeError('Pages failed for ' + sha + ': ' +
                                                 str(latest.get('conclusion')))
                          print('Pages deployment confirmed:', latest['html_url'])
                          break
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      raise RuntimeError('Cannot read Pages run status; check actions:read') from error
                  print('Pages API temporary HTTP error:', error.code)
              except (urllib.error.URLError, TimeoutError) as error:
                  print('Pages API temporarily unavailable:', error)
              if attempt == 59:
                  raise TimeoutError('No successful Pages deployment found for '+sha)
              time.sleep(5)
      - name: Wait for exact approved application files on Pages
        shell: python
        run: |
          from pathlib import Path
          import hashlib, time, urllib.request
          paths = ['index.html', 'teal/index.html', 'teal/teal.js', 'human-literacy/index.html',
                   'simulator/01/index.html', 'simulator/01/coach.js',
                   'one-place/money-bills.html', 'one-place/family-handoff.html',
                   'one-place/health-wellness.html', 'one-place/health-literacy-lab.html',
                   'one-place/health-costs-lab.html',
                   'one-place/care-navigation.html',
                   'one-place/digital-safety-practice.html']
          paths += [f'lessons/{n:02}/index.html' for n in range(1, 11)]
          for attempt in range(60):
              try:
                  for path in paths:
                      request = urllib.request.Request('https://ouroneplace.github.io/' + path,
                          headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200
                          assert hashlib.sha256(response.read()).digest() == hashlib.sha256(Path(path).read_bytes()).digest(), path
                  print(f'PASS: {len(paths)} deployed application files match checkout bytes')
                  break
              except Exception as error:
                  print(f'Pages readiness attempt {attempt + 1}: {error}')
                  if attempt == 59:
                      raise
                  time.sleep(10)
      - run: node scripts/verify_live_site.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-one-place-verification
          path: live-site-report/
          retention-days: 7

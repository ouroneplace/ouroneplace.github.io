name: Site and browser regression tests
on:
  push:
    branches:
      - main
      - founder-preview
  pull_request:
  workflow_dispatch:

# An open PR needs one run, not both a branch-push run and a PR run.
# When a new commit arrives, discard older in-progress runs for that PR.
concurrency:
  group: site-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload privacy-safe screenshots for founder visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-visual-review
          path: review-artifacts/
          if-no-files-found: ignore
          retention-days: 7

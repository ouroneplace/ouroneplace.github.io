name: Site and browser regression tests
on:
  push:
    branches:
      - main
      - founder-preview
  pull_request:
  workflow_dispatch:

# An open PR needs one run, not both a branch-push run and a PR run.
# When a new commit arrives, discard older in-progress runs for that PR.
concurrency:
  group: site-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RC_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Synthetic screenshots are QA evidence, not human visual approval.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc01-multi-viewport-visual-evidence
          path: test-results/hq-rc01-visual-evidence/
          if-no-files-found: warn
          retention-days: 7
      # Preserve read-only official resource browser outcomes; offsite errors are non-gating.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc01-official-browser-observations
          path: test-results/hq-rc01-external-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: Site and browser regression tests
on:
  push:
    branches:
      - main
      - founder-preview
  pull_request:
  workflow_dispatch:

# An open PR needs one run, not both a branch-push run and a PR run.
# When a new commit arrives, discard older in-progress runs for that PR.
concurrency:
  group: site-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          # Only this draft branch generates visual review screenshots.
          HQ_CAPTURE_VISUALS: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/two-area-access-conversation-20261112' }}
          HQ_REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'integration/two-area-access-conversation-20261112'
        with:
          name: hq-rc02-visual-evidence
          path: hq-visual-evidence/
          if-no-files-found: error
          retention-days: 7

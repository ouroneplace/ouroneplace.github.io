name: Import approved Lesson 04 video
on:
  push:
    branches:
      - feature/lesson04-native-player-fix-20261108
    paths:
      - .github/workflows/import-lesson04-media.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve published Lesson 04 MP4
        env:
          MEDIA_DOWNLOAD_URL: "https://media.descriptusercontent.com/v3/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2Ffaf9cd5c-fd7d-48fc-9e6e-a6d3fb154508%2Fhls%3Fexpiration%3D1794286837812%26signature%3D24a8674973835bae6e1236eefaf7527637ab63b8c6690bd9f34977f4fe7a35aa&filename=Lesson+04+Understanding+Boundaries.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1794283238&signature=e65079b6459cc9ef288fc8b4b705aa8b45dbc0f6f1df53bf01914ec3ef503ca3"
        run: |
          set -euo pipefail
          mkdir -p media
          curl --fail --location --retry 3 --silent --show-error "$MEDIA_DOWNLOAD_URL" --output media/lesson04.mp4
          test -s media/lesson04.mp4
          file media/lesson04.mp4
          test "$(wc -c < media/lesson04.mp4)" -gt 1000000
      - name: Commit native video and remove temporary importer
        run: |
          set -euo pipefail
          git config user.name "ONE PLACE automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/lesson04.mp4
          git rm .github/workflows/import-lesson04-media.yml
          git commit -m "Add Lesson 04 native video asset"
          git push origin HEAD:feature/lesson04-native-player-fix-20261108
